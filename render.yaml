services:
  - type: web
    name: api-security-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PROJECT_CREDENTIALS_KEY
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: api-security-redis
          property: connectionString

  - type: worker
    name: api-security-worker
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm run worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PROJECT_CREDENTIALS_KEY
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: api-security-redis
          property: connectionString

  - type: keyvalue
    name: api-security-redis
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web
    name: api-security-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: api-security-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
